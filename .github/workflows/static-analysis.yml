name: Static Analysis

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: Static-Analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse_action:
    name: REUSE Compliance Check
    uses: StanfordBDHG/.github/.github/workflows/reuse.yml@v2
  swiftlint:
    name: SwiftLint
    uses: StanfordBDHG/.github/.github/workflows/swiftlint.yml@v2
  markdown_link_check:
    name: Markdown Link Check
    uses: StanfordBDHG/.github/.github/workflows/markdown-link-check.yml@v2
  breaking_changes:
    name: Diagnose Breaking Changes
    uses: StanfordBDHG/.github/.github/workflows/breaking-changes.yml@v2
    if: ${{ github.ref_name != 'main' }}
    with:
      runsonlabels: '["macOS", "self-hosted"]'
  generated_conformances:
    name: Generated Conformances
    runs-on: [macOS, self-hosted]
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: swift package resolve
      - name: Regenerate the FHIRTypeWithExtensions conformances
        run: python3 Scripts/generate_extension_conformances.py
      - name: Verify the committed file is up to date
        run: git diff --exit-code -- Sources/FHIRModelsExtensions/FHIRTypeWithExtensions+Conformances.swift
